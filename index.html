<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0a1a0a">
  <title>Three.js Tree</title>
  <link rel="manifest" href="manifest.json">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0a1a0a; }
    canvas { display: block; }
    #hint {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 255, 255, 0.75);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      letter-spacing: 0.5px;
      background: rgba(0, 0, 0, 0.35);
      padding: 9px 22px;
      border-radius: 24px;
      pointer-events: none;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      transition: opacity 1s ease;
    }
    #hint.hidden { opacity: 0; }
  </style>
</head>
<body>
  <div id="hint">Drag to orbit &nbsp;·&nbsp; Pinch to zoom</div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // ── Renderer ──────────────────────────────────────────────────────────────
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    // ── Scene ─────────────────────────────────────────────────────────────────
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x0d2a0d, 0.012);

    // ── Camera ────────────────────────────────────────────────────────────────
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 200);
    camera.position.set(10, 9, 20);

    // ── Controls ──────────────────────────────────────────────────────────────
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.07;
    controls.minDistance = 5;
    controls.maxDistance = 70;
    controls.maxPolarAngle = Math.PI * 0.47;
    controls.target.set(0, 7, 0);
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.6;
    controls.update();

    // Hide hint and stop auto-rotate on first touch/click
    const hint = document.getElementById('hint');
    renderer.domElement.addEventListener('pointerdown', () => {
      controls.autoRotate = false;
      hint.classList.add('hidden');
    }, { once: true });

    // ── Lighting ──────────────────────────────────────────────────────────────
    scene.add(new THREE.AmbientLight(0x334433, 1.8));

    const sun = new THREE.DirectionalLight(0xffd080, 2.2);
    sun.position.set(20, 30, 15);
    scene.add(sun);

    const rimLight = new THREE.DirectionalLight(0x4466aa, 0.5);
    rimLight.position.set(-15, 8, -10);
    scene.add(rimLight);

    // ── Sky gradient ──────────────────────────────────────────────────────────
    const skySphere = new THREE.Mesh(
      new THREE.SphereGeometry(120, 16, 8),
      new THREE.ShaderMaterial({
        side: THREE.BackSide,
        uniforms: {
          uTop:    { value: new THREE.Color(0x0b1e3a) },
          uBottom: { value: new THREE.Color(0x1c4d1c) },
        },
        vertexShader: `
          varying float vY;
          void main() {
            vY = normalize(position).y;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
        fragmentShader: `
          uniform vec3 uTop;
          uniform vec3 uBottom;
          varying float vY;
          void main() {
            float t = clamp((vY + 0.15) / 0.9, 0.0, 1.0);
            gl_FragColor = vec4(mix(uBottom, uTop, pow(t, 0.6)), 1.0);
          }
        `
      })
    );
    scene.add(skySphere);

    // ── Ground ────────────────────────────────────────────────────────────────
    const ground = new THREE.Mesh(
      new THREE.CircleGeometry(80, 64),
      new THREE.MeshLambertMaterial({ color: 0x2a5e18 })
    );
    ground.rotation.x = -Math.PI / 2;
    scene.add(ground);

    // ── Tree ──────────────────────────────────────────────────────────────────
    const barkMat = new THREE.MeshLambertMaterial({ color: 0x6b4226 });
    const leafPalette = [
      new THREE.MeshLambertMaterial({ color: 0x2e7d32 }),
      new THREE.MeshLambertMaterial({ color: 0x388e3c }),
      new THREE.MeshLambertMaterial({ color: 0x1b5e20 }),
      new THREE.MeshLambertMaterial({ color: 0x43a047 }),
    ];

    const treeRoot = new THREE.Group();
    scene.add(treeRoot);

    // Deterministic pseudo-random from a seed
    function rng(s) { return (Math.sin(s * 127.1 + 311.7) * 43758.5453) % 1; }

    function buildBranch(parent, len, rad, depth, seed) {
      // Cylinder with pivot at base (y=0 .. y=len)
      const geo = new THREE.CylinderGeometry(rad * 0.62, rad, len, 7);
      geo.translate(0, len / 2, 0);
      const mesh = new THREE.Mesh(geo, barkMat);
      parent.add(mesh);

      if (depth <= 0) {
        // Leaf cluster at branch tip
        const r = Math.abs(rng(seed * 3.7)) * 0.4 + 1.1;
        const leafGeo = new THREE.SphereGeometry(r, 8, 6);
        const leaf = new THREE.Mesh(leafGeo, leafPalette[Math.floor(Math.abs(rng(seed * 11)) * 4)]);
        leaf.position.y = len;
        leaf.scale.set(
          1 + rng(seed * 2.1) * 0.25,
          0.85 + rng(seed * 3.3) * 0.25,
          1 + rng(seed * 4.7) * 0.25
        );
        mesh.add(leaf);
        return;
      }

      const count = depth === 1 ? 5 : 3;
      for (let i = 0; i < count; i++) {
        const s = seed + i * 0.317 + depth * 0.119;
        const g = new THREE.Group();
        // Attach near the top of this branch
        g.position.y = len * (0.82 + rng(s * 7.1) * 0.12);
        g.rotation.y = (i / count) * Math.PI * 2 + rng(s * 5.3) * 0.8;
        g.rotation.z = 0.35 + depth * 0.06 + rng(s * 9.7) * 0.15;
        mesh.add(g);
        buildBranch(g, len * (0.62 + rng(s * 3.1) * 0.08), rad * 0.60, depth - 1, s);
      }
    }

    buildBranch(treeRoot, 5.5, 0.52, 4, 0.42);

    // ── Ground grass tufts ────────────────────────────────────────────────────
    const grassMat = new THREE.MeshLambertMaterial({ color: 0x3d7a18, side: THREE.DoubleSide });
    for (let i = 0; i < 120; i++) {
      const a = rng(i * 1.3) * Math.PI * 2;
      const r = 2.5 + rng(i * 2.7) * 18;
      const h = 0.25 + rng(i * 3.9) * 0.35;
      const cone = new THREE.Mesh(new THREE.ConeGeometry(0.09, h, 4), grassMat);
      cone.position.set(Math.cos(a) * r, h / 2, Math.sin(a) * r);
      cone.rotation.y = rng(i * 5.1) * Math.PI;
      cone.rotation.z = (rng(i * 7.3) - 0.5) * 0.3;
      scene.add(cone);
    }

    // ── Lumberjack ────────────────────────────────────────────────────────────
    const skinMat   = new THREE.MeshLambertMaterial({ color: 0xfdbba0 });
    const shirtMat  = new THREE.MeshLambertMaterial({ color: 0xc62828 }); // red flannel
    const pantsMat  = new THREE.MeshLambertMaterial({ color: 0x1a237e }); // dark jeans
    const bootMat   = new THREE.MeshLambertMaterial({ color: 0x3e2723 });
    const hairMat   = new THREE.MeshLambertMaterial({ color: 0x4e342e });
    const handleMat = new THREE.MeshLambertMaterial({ color: 0x8d6e63 });
    const bladeMat  = new THREE.MeshLambertMaterial({ color: 0xb0bec5 });

    // jack.rotation.y = -π/2 makes local +Z face world -X (toward tree at origin)
    const jack = new THREE.Group();
    jack.position.set(1.5, 0, 0);
    jack.rotation.y = -Math.PI / 2;
    scene.add(jack);

    function jm(geo, mat, x, y, z) {
      const m = new THREE.Mesh(geo, mat);
      m.position.set(x, y, z);
      jack.add(m);
      return m;
    }

    // Boots
    jm(new THREE.BoxGeometry(0.18, 0.15, 0.28), bootMat, -0.13, 0.075, 0.02);
    jm(new THREE.BoxGeometry(0.18, 0.15, 0.28), bootMat,  0.13, 0.075, 0.02);
    // Legs
    jm(new THREE.CylinderGeometry(0.09, 0.10, 0.65, 6), pantsMat, -0.13, 0.475, 0);
    jm(new THREE.CylinderGeometry(0.09, 0.10, 0.65, 6), pantsMat,  0.13, 0.475, 0);
    // Torso
    jm(new THREE.BoxGeometry(0.52, 0.58, 0.30), shirtMat, 0, 1.09, 0);
    // Head
    jm(new THREE.BoxGeometry(0.34, 0.34, 0.34), skinMat, 0, 1.62, 0);
    // Hair
    jm(new THREE.BoxGeometry(0.35, 0.09, 0.35), hairMat, 0, 1.82, 0);
    // Beard
    jm(new THREE.BoxGeometry(0.27, 0.12, 0.09), hairMat, 0, 1.48, 0.175);

    // Right arm pivot at shoulder — animated for the chop swing
    const rightArmPivot = new THREE.Group();
    rightArmPivot.position.set(0.31, 1.36, 0);
    jack.add(rightArmPivot);
    const rArm = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.065, 0.56, 6), shirtMat);
    rArm.position.y = -0.28;
    rightArmPivot.add(rArm);

    // Axe — parented to right arm pivot so it swings with the arm
    const axePivot = new THREE.Group();
    axePivot.position.y = -0.56; // at arm tip / hand grip
    rightArmPivot.add(axePivot);

    const axeHandleMesh = new THREE.Mesh(
      new THREE.CylinderGeometry(0.034, 0.028, 0.60, 6), handleMat
    );
    axeHandleMesh.position.y = -0.30; // handle center
    axePivot.add(axeHandleMesh);

    // Axe head: wide in local X (jack's +X = world +Z, so blade face is visible from the side)
    const axeHeadMesh = new THREE.Mesh(
      new THREE.BoxGeometry(0.36, 0.30, 0.08), bladeMat
    );
    axeHeadMesh.position.set(0.06, -0.60, 0); // at handle end, bit toward cutting side
    axePivot.add(axeHeadMesh);
    // Poll (back of axe head)
    const axePollMesh = new THREE.Mesh(
      new THREE.BoxGeometry(0.14, 0.22, 0.07), bladeMat
    );
    axePollMesh.position.set(-0.14, -0.60, 0);
    axePivot.add(axePollMesh);

    // Left arm pivot — small counter-sway for balance
    const leftArmPivot = new THREE.Group();
    leftArmPivot.position.set(-0.31, 1.36, 0);
    jack.add(leftArmPivot);
    const lArm = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.065, 0.56, 6), shirtMat);
    lArm.position.y = -0.28;
    leftArmPivot.add(lArm);

    // Chop wound on the trunk facing the lumberjack
    const wound = new THREE.Mesh(
      new THREE.BoxGeometry(0.62, 0.28, 0.36),
      new THREE.MeshLambertMaterial({ color: 0xd4a46a })
    );
    wound.position.set(0.46, 0.38, 0);
    treeRoot.add(wound);

    // Wood chips scattered on the ground near the trunk base
    const chipMat = new THREE.MeshLambertMaterial({ color: 0xc9b99a });
    for (let i = 0; i < 18; i++) {
      const chip = new THREE.Mesh(
        new THREE.BoxGeometry(
          0.10 + Math.abs(rng(i * 3.1)) * 0.12,
          0.04,
          0.06 + Math.abs(rng(i * 5.7)) * 0.07
        ),
        chipMat
      );
      chip.position.set(
        0.65 + Math.abs(rng(i * 1.3)) * 1.1,
        0.022,
        rng(i * 2.9) * 0.95
      );
      chip.rotation.y = rng(i * 7.1) * Math.PI;
      chip.rotation.z = rng(i * 9.3) * 0.3;
      scene.add(chip);
    }

    // ── Tree swing ────────────────────────────────────────────────────────────
    const ropeMat = new THREE.MeshLambertMaterial({ color: 0xd4b483 });
    const seatMat = new THREE.MeshLambertMaterial({ color: 0xa0522d });

    const ROPE_LEN  = 4.0;
    const ROPE_HALF = 0.36; // half-gap between the two ropes

    // Pivot sits in the canopy — ropes visually disappear into the foliage
    const swingPivot = new THREE.Group();
    swingPivot.position.set(-2.4, 7.8, 0.7);
    scene.add(swingPivot);

    [-ROPE_HALF, ROPE_HALF].forEach(x => {
      const rope = new THREE.Mesh(
        new THREE.CylinderGeometry(0.025, 0.025, ROPE_LEN, 5), ropeMat
      );
      rope.position.set(x, -ROPE_LEN / 2, 0);
      swingPivot.add(rope);
    });

    const swingSeat = new THREE.Mesh(
      new THREE.BoxGeometry(ROPE_HALF * 2 + 0.22, 0.07, 0.24), seatMat
    );
    swingSeat.position.y = -ROPE_LEN;
    swingPivot.add(swingSeat);

    // ── Kid on the swing ──────────────────────────────────────────────────────
    const kSkin  = new THREE.MeshLambertMaterial({ color: 0xffcc99 });
    const kTop   = new THREE.MeshLambertMaterial({ color: 0xe91e63 }); // pink top
    const kPants = new THREE.MeshLambertMaterial({ color: 0x283593 });
    const kShoe  = new THREE.MeshLambertMaterial({ color: 0xb71c1c });
    const kHair  = new THREE.MeshLambertMaterial({ color: 0x3e2723 });

    const kidGroup = new THREE.Group();
    kidGroup.position.y = -ROPE_LEN; // sit on seat
    swingPivot.add(kidGroup);

    function km(geo, mat, x, y, z) {
      const m = new THREE.Mesh(geo, mat);
      m.position.set(x, y, z);
      kidGroup.add(m);
      return m;
    }

    // Torso, head, hair
    km(new THREE.BoxGeometry(0.34, 0.38, 0.20), kTop,  0, 0.22, 0);
    km(new THREE.BoxGeometry(0.27, 0.27, 0.27), kSkin, 0, 0.57, 0);
    km(new THREE.BoxGeometry(0.28, 0.08, 0.28), kHair, 0, 0.72, 0);   // hair cap
    km(new THREE.BoxGeometry(0.08, 0.19, 0.08), kHair, -0.20, 0.67, 0); // left pigtail
    km(new THREE.BoxGeometry(0.08, 0.19, 0.08), kHair,  0.20, 0.67, 0); // right pigtail

    // Arms reaching up and outward to grip the ropes
    const kArmL = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.045, 0.52, 5), kTop);
    kArmL.position.set(-0.32, 0.46, 0);
    kArmL.rotation.z = -0.52;
    kidGroup.add(kArmL);
    const kArmR = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.045, 0.52, 5), kTop);
    kArmR.position.set( 0.32, 0.46, 0);
    kArmR.rotation.z =  0.52;
    kidGroup.add(kArmR);

    // Leg group — pivot at hips so rotation.x kicks legs forward/back
    const kidLegsGroup = new THREE.Group();
    kidGroup.add(kidLegsGroup);

    function kl(geo, mat, x, y, z) {
      const m = new THREE.Mesh(geo, mat);
      m.position.set(x, y, z);
      kidLegsGroup.add(m);
      return m;
    }

    kl(new THREE.BoxGeometry(0.11, 0.11, 0.30), kPants, -0.10,  0.00, -0.15); // L thigh
    kl(new THREE.BoxGeometry(0.11, 0.11, 0.30), kPants,  0.10,  0.00, -0.15); // R thigh
    kl(new THREE.BoxGeometry(0.09, 0.28, 0.09), kPants, -0.10, -0.20, -0.30); // L shin
    kl(new THREE.BoxGeometry(0.09, 0.28, 0.09), kPants,  0.10, -0.20, -0.30); // R shin
    kl(new THREE.BoxGeometry(0.12, 0.09, 0.17), kShoe,  -0.10, -0.36, -0.30); // L shoe
    kl(new THREE.BoxGeometry(0.12, 0.09, 0.17), kShoe,   0.10, -0.36, -0.30); // R shoe

    // ── Logging truck ─────────────────────────────────────────────────────────
    // truck.rotation.y = π/2 → local +Z maps to world +X
    // so the truck length runs along world X; bed end (local z=-4.5) sits at world x≈1.0,
    // right beside the lumberjack at (1.5, 0, 0)
    const trkCab     = new THREE.MeshLambertMaterial({ color: 0x0d47a1 });
    const trkBed     = new THREE.MeshLambertMaterial({ color: 0x546e7a });
    const trkTire    = new THREE.MeshLambertMaterial({ color: 0x1a1a1a });
    const trkHub     = new THREE.MeshLambertMaterial({ color: 0x9e9e9e });
    const trkGlass   = new THREE.MeshLambertMaterial({ color: 0x80d8ff, transparent: true, opacity: 0.55 });
    const trkChrome  = new THREE.MeshLambertMaterial({ color: 0xe0e0e0 });
    const trkStake   = new THREE.MeshLambertMaterial({ color: 0x6d4c41 });
    const trkLight   = new THREE.MeshLambertMaterial({ color: 0xfffde7, emissive: new THREE.Color(0x554400) });
    const trkLogSide = new THREE.MeshLambertMaterial({ color: 0x8d6e63 });
    const trkLogEnd  = new THREE.MeshLambertMaterial({ color: 0xe8cfa0 });

    const truck = new THREE.Group();
    truck.position.set(5.5, 0, -1.5);
    truck.rotation.y = Math.PI / 2;
    scene.add(truck);

    function tm(geo, mat, x, y, z) {
      const m = new THREE.Mesh(geo, mat);
      m.position.set(x, y, z);
      truck.add(m);
      return m;
    }

    // Frame rail
    tm(new THREE.BoxGeometry(1.8, 0.22, 7.2), trkBed, 0, 0.45, -1.1);

    // Cab — hood (front lower) + main body + roof
    tm(new THREE.BoxGeometry(1.90, 0.85, 1.40), trkCab, 0, 1.10,  1.90);
    tm(new THREE.BoxGeometry(1.90, 1.40, 1.80), trkCab, 0, 1.75,  0.90);
    tm(new THREE.BoxGeometry(1.75, 0.28, 1.70), trkCab, 0, 2.52,  0.85);
    // Windshield & windows
    tm(new THREE.BoxGeometry(1.65, 0.82, 0.07), trkGlass, 0, 2.00,  1.78);
    tm(new THREE.BoxGeometry(1.58, 0.62, 0.07), trkGlass, 0, 2.00,  0.03);
    tm(new THREE.BoxGeometry(0.07, 0.62, 1.24), trkGlass, -0.97, 2.00, 0.90);
    tm(new THREE.BoxGeometry(0.07, 0.62, 1.24), trkGlass,  0.97, 2.00, 0.90);
    // Grille + bumper
    tm(new THREE.BoxGeometry(1.58, 0.72, 0.09), trkBed,    0, 1.04, 2.63);
    tm(new THREE.BoxGeometry(2.02, 0.22, 0.18), trkChrome, 0, 0.67, 2.66);
    // Headlights
    tm(new THREE.BoxGeometry(0.30, 0.20, 0.08), trkLight, -0.64, 1.10, 2.66);
    tm(new THREE.BoxGeometry(0.30, 0.20, 0.08), trkLight,  0.64, 1.10, 2.66);
    // Exhaust stack
    const stack = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, 2.0, 7), trkChrome);
    stack.position.set(0.72, 2.55, 1.20);
    truck.add(stack);

    // Bed floor + walls + bulkhead
    tm(new THREE.BoxGeometry(2.00, 0.10, 4.50), trkBed, 0, 0.68, -1.85);
    tm(new THREE.BoxGeometry(0.10, 0.55, 4.50), trkBed, -0.95, 0.96, -1.85);
    tm(new THREE.BoxGeometry(0.10, 0.55, 4.50), trkBed,  0.95, 0.96, -1.85);
    tm(new THREE.BoxGeometry(2.00, 0.75, 0.10), trkBed, 0, 0.96,  0.03);

    // Log stakes (vertical posts that keep logs from rolling off sides)
    [-2.6, -1.3, 0.0].forEach(z => {
      tm(new THREE.BoxGeometry(0.10, 1.10, 0.10), trkStake, -1.0, 1.30, z);
      tm(new THREE.BoxGeometry(0.10, 1.10, 0.10), trkStake,  1.0, 1.30, z);
    });

    // Wheels — CylinderGeometry axis=Y rotated π/2 around Z → axis aligns with local X
    [[-1.10, 0.53,  1.90],
     [ 1.10, 0.53,  1.90],
     [-1.15, 0.53, -1.00],
     [ 1.15, 0.53, -1.00],
     [-1.15, 0.53, -2.40],
     [ 1.15, 0.53, -2.40],
    ].forEach(([wx, wy, wz]) => {
      const tire = new THREE.Mesh(new THREE.CylinderGeometry(0.53, 0.53, 0.30, 12), trkTire);
      tire.position.set(wx, wy, wz);
      tire.rotation.z = Math.PI / 2;
      truck.add(tire);
      const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.22, 0.31, 8), trkHub);
      hub.position.set(wx, wy, wz);
      hub.rotation.z = Math.PI / 2;
      truck.add(hub);
    });

    // Logs stacked in bed — cylinders along local X (= world -Z with this truck rotation)
    // Material array: [side-bark, end-cap, end-cap]
    const logBedMats = [trkLogSide, trkLogEnd, trkLogEnd];
    [{ z: -3.2, y: 1.00, r: 0.32 },
     { z: -2.3, y: 1.00, r: 0.29 },
     { z: -1.5, y: 1.00, r: 0.31 },
     { z: -2.8, y: 1.62, r: 0.27 },
     { z: -1.9, y: 1.62, r: 0.25 },
     { z: -2.4, y: 2.12, r: 0.22 },
    ].forEach(({ z, y, r }) => {
      const log = new THREE.Mesh(
        new THREE.CylinderGeometry(r, r * 0.96, 1.78, 9), logBedMats
      );
      log.position.set(0, y, z);
      log.rotation.z = Math.PI / 2;
      truck.add(log);
    });

    // ── Dinosaur (T-Rex eating meat) ──────────────────────────────────────────
    const dinoGreen  = new THREE.MeshLambertMaterial({ color: 0x558b2f });
    const dinoBellyM = new THREE.MeshLambertMaterial({ color: 0x8bc34a });
    const dinoTooth  = new THREE.MeshLambertMaterial({ color: 0xfff9c4 });
    const dinoEyeM   = new THREE.MeshLambertMaterial({ color: 0xf57f17, emissive: new THREE.Color(0x331100) });
    const dinoNostM  = new THREE.MeshLambertMaterial({ color: 0x33691e });
    const dinoMeatM  = new THREE.MeshLambertMaterial({ color: 0xb71c1c });
    const dinoBoneM  = new THREE.MeshLambertMaterial({ color: 0xf5f5dc });
    const dinoBloodM = new THREE.MeshLambertMaterial({ color: 0x7f0000 });

    const dinoGroup = new THREE.Group();
    dinoGroup.position.set(-4.0, 0, 7.0);
    dinoGroup.rotation.y = 0.6;
    scene.add(dinoGroup);

    // ── Hind legs ──
    [-0.72, 0.72].forEach(lx => {
      const thigh = new THREE.Mesh(new THREE.CylinderGeometry(0.36, 0.30, 1.55, 7), dinoGreen);
      thigh.position.set(lx, 2.0, 0.1);  thigh.rotation.x = 0.15;
      dinoGroup.add(thigh);
      const shin = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.17, 1.45, 7), dinoGreen);
      shin.position.set(lx, 0.82, 0.45); shin.rotation.x = -0.25;
      dinoGroup.add(shin);
      const foot = new THREE.Mesh(new THREE.BoxGeometry(0.44, 0.20, 0.68), dinoGreen);
      foot.position.set(lx, 0.10, 0.65);
      dinoGroup.add(foot);
      for (let ti = -1; ti <= 1; ti++) {
        const toe = new THREE.Mesh(new THREE.ConeGeometry(0.06, 0.28, 4), dinoGreen);
        toe.position.set(lx + ti * 0.16, 0.08, 0.93);
        toe.rotation.x = Math.PI / 2;
        dinoGroup.add(toe);
      }
    });

    // ── Upper body (leaned forward for feeding pose) ──
    const dinoBody = new THREE.Group();
    dinoBody.position.set(0, 2.5, 0);
    dinoBody.rotation.x = -0.85;
    dinoGroup.add(dinoBody);

    const torsoD = new THREE.Mesh(new THREE.BoxGeometry(1.9, 1.2, 2.8), dinoGreen);
    dinoBody.add(torsoD);
    const bellyD = new THREE.Mesh(new THREE.BoxGeometry(1.55, 0.55, 2.7), dinoBellyM);
    bellyD.position.y = -0.55;
    dinoBody.add(bellyD);

    // Tail — four shrinking segments behind the body
    [[1.00, 0.85, 1.20,  0.05, -1.85],
     [0.70, 0.60, 1.00,  0.00, -3.00],
     [0.44, 0.40, 0.90, -0.05, -3.95],
     [0.24, 0.23, 0.70, -0.10, -4.80],
    ].forEach(([w, h, d, dy, z]) => {
      const seg = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), dinoGreen);
      seg.position.set(0, dy, z);
      dinoBody.add(seg);
    });

    // Tiny T-Rex arms
    [-0.76, 0.76].forEach(ax => {
      const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.09, 0.60, 6), dinoGreen);
      arm.position.set(ax, 0.10, 1.20);
      arm.rotation.z = ax > 0 ? 0.75 : -0.75;
      arm.rotation.x = 0.45;
      dinoBody.add(arm);
      const hand = new THREE.Mesh(new THREE.BoxGeometry(0.20, 0.13, 0.20), dinoGreen);
      hand.position.set(ax > 0 ? ax + 0.18 : ax - 0.18, -0.05, 1.38);
      dinoBody.add(hand);
    });

    // ── Neck ──
    const dinoNeck = new THREE.Group();
    dinoNeck.position.set(0, 0.30, 1.40);
    dinoNeck.rotation.x = -0.50;
    dinoBody.add(dinoNeck);
    const neckCylD = new THREE.Mesh(new THREE.CylinderGeometry(0.37, 0.52, 1.55, 7), dinoGreen);
    neckCylD.position.y = -0.78;
    dinoNeck.add(neckCylD);

    // ── Head ──
    const dinoHead = new THREE.Group();
    dinoHead.position.y = -1.55;
    dinoHead.rotation.x = 0.25; // tilt toward meat
    dinoNeck.add(dinoHead);

    const skullD = new THREE.Mesh(new THREE.BoxGeometry(1.18, 0.62, 0.88), dinoGreen);
    skullD.position.set(0, 0.14, -0.12);
    dinoHead.add(skullD);
    const upperSnout = new THREE.Mesh(new THREE.BoxGeometry(1.04, 0.40, 1.52), dinoGreen);
    upperSnout.position.set(0, -0.10, 0.82);
    dinoHead.add(upperSnout);

    // Eyes + brow ridges
    [-0.52, 0.52].forEach(ex => {
      const eyeM = new THREE.Mesh(new THREE.SphereGeometry(0.13, 8, 6), dinoEyeM);
      eyeM.position.set(ex, 0.36, 0.08);
      dinoHead.add(eyeM);
      const brow = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.09, 0.15), dinoGreen);
      brow.position.set(ex, 0.50, 0.0);
      dinoHead.add(brow);
    });
    [-0.22, 0.22].forEach(nx => {
      const nostril = new THREE.Mesh(new THREE.SphereGeometry(0.06, 5, 4), dinoNostM);
      nostril.position.set(nx, 0.08, 1.52);
      dinoHead.add(nostril);
    });

    // Upper teeth (point downward)
    for (let i = -2; i <= 2; i++) {
      const tooth = new THREE.Mesh(new THREE.ConeGeometry(0.055, 0.22, 4), dinoTooth);
      tooth.position.set(i * 0.19, -0.28, 0.65 + Math.abs(i) * 0.05);
      tooth.rotation.z = Math.PI;
      upperSnout.add(tooth);
    }

    // ── Lower jaw (pivot animated for chewing) ──
    const jawPivot = new THREE.Group();
    jawPivot.position.set(0, -0.04, -0.18);
    dinoHead.add(jawPivot);
    const lowerJawD = new THREE.Mesh(new THREE.BoxGeometry(1.00, 0.32, 1.48), dinoGreen);
    lowerJawD.position.set(0, -0.14, 0.76);
    jawPivot.add(lowerJawD);
    for (let i = -2; i <= 2; i++) {
      const tooth = new THREE.Mesh(new THREE.ConeGeometry(0.050, 0.20, 4), dinoTooth);
      tooth.position.set(i * 0.18, 0.18, 0.65 + Math.abs(i) * 0.04);
      lowerJawD.add(tooth);
    }

    // ── Meat pile (on ground in front of dinosaur) ──
    const meatPile = new THREE.Group();
    meatPile.position.set(0, 0, 2.80);
    dinoGroup.add(meatPile);

    const mp1 = new THREE.Mesh(new THREE.BoxGeometry(1.05, 0.52, 0.78), dinoMeatM);
    mp1.position.y = 0.26; meatPile.add(mp1);
    const mp2 = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.38, 0.52), dinoMeatM);
    mp2.position.set(0.38, 0.22, 0.30); meatPile.add(mp2);
    const mp3 = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.28, 0.40), dinoMeatM);
    mp3.position.set(-0.32, 0.18, 0.28); meatPile.add(mp3);

    // Bone protruding from the meat
    const boneShaftD = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, 1.35, 6), dinoBoneM);
    boneShaftD.position.set(-0.12, 0.68, 0.08);
    boneShaftD.rotation.z = 0.55; boneShaftD.rotation.x = 0.18;
    meatPile.add(boneShaftD);
    const bk1 = new THREE.Mesh(new THREE.SphereGeometry(0.17, 6, 5), dinoBoneM);
    bk1.position.set(-0.52, 1.10, 0.16); meatPile.add(bk1);
    const bk2 = new THREE.Mesh(new THREE.SphereGeometry(0.14, 6, 5), dinoBoneM);
    bk2.position.set(0.28, 0.26, 0.0);  meatPile.add(bk2);

    // Dark blood pool on the ground
    const bloodPool = new THREE.Mesh(new THREE.CircleGeometry(0.72, 10), dinoBloodM);
    bloodPool.rotation.x = -Math.PI / 2;
    bloodPool.position.y = 0.01;
    meatPile.add(bloodPool);

    // ── Floating leaf particles ────────────────────────────────────────────────
    const LEAF_COUNT = 350;
    const leafPos = new Float32Array(LEAF_COUNT * 3);
    const leafVel = new Float32Array(LEAF_COUNT * 3);

    for (let i = 0; i < LEAF_COUNT; i++) {
      const a = rng(i * 1.7) * Math.PI * 2;
      const r = rng(i * 2.3) * 14;
      leafPos[i * 3]     = Math.cos(a) * r;
      leafPos[i * 3 + 1] = rng(i * 3.1) * 22;
      leafPos[i * 3 + 2] = Math.sin(a) * r;
      leafVel[i * 3]     = (rng(i * 4.1) - 0.5) * 0.028;
      leafVel[i * 3 + 1] = -(0.012 + rng(i * 5.3) * 0.018);
      leafVel[i * 3 + 2] = (rng(i * 6.7) - 0.5) * 0.028;
    }

    const leafPtGeo = new THREE.BufferGeometry();
    leafPtGeo.setAttribute('position', new THREE.BufferAttribute(leafPos, 3));
    const leafPts = new THREE.Points(leafPtGeo, new THREE.PointsMaterial({
      color: 0x66dd44,
      size: 0.20,
      transparent: true,
      opacity: 0.80,
      sizeAttenuation: true,
    }));
    scene.add(leafPts);

    // ── Resize ────────────────────────────────────────────────────────────────
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ── Animation loop ────────────────────────────────────────────────────────
    let t = 0;

    function animate() {
      requestAnimationFrame(animate);
      t += 0.012;

      // Gentle wind sway on the whole tree
      treeRoot.rotation.x = Math.sin(t * 0.4) * 0.018;
      treeRoot.rotation.z = Math.sin(t * 0.6 + 1.2) * 0.018;

      // Lumberjack chopping animation
      // rotation.x > 0 swings arm toward the tree (jack's local +Z = world -X)
      const chopSin = Math.sin(t * 2.2);
      rightArmPivot.rotation.x = -0.10 + chopSin * 1.10; // -1.20 raised back → +1.00 impact
      leftArmPivot.rotation.x  =  0.20 + Math.sin(t * 2.2 + 0.6) * 0.18; // small counter-sway
      jack.rotation.z = chopSin * 0.04; // lean into swing

      // Tree swing animation
      const swingAngle = Math.sin(t * 1.1) * 0.42;
      swingPivot.rotation.x = swingAngle;
      kidLegsGroup.rotation.x = Math.sin(t * 1.1 + 0.7) * 0.30; // legs kick out of phase

      // Dinosaur eating animation
      jawPivot.rotation.x = Math.max(0, Math.sin(t * 2.0)) * 0.55; // jaw snaps open/shut
      dinoHead.rotation.x = 0.25 + Math.sin(t * 0.9) * 0.12;       // slow head bob
      dinoGroup.rotation.y = 0.6 + Math.sin(t * 0.22) * 0.07;      // subtle body sway

      // Update floating leaves
      const p = leafPtGeo.attributes.position.array;
      for (let i = 0; i < LEAF_COUNT; i++) {
        p[i * 3]     += leafVel[i * 3]     + Math.sin(t + i * 0.7) * 0.004;
        p[i * 3 + 1] += leafVel[i * 3 + 1];
        p[i * 3 + 2] += leafVel[i * 3 + 2] + Math.cos(t * 0.8 + i * 0.5) * 0.004;

        if (p[i * 3 + 1] < -0.5) {
          const a2 = Math.random() * Math.PI * 2;
          const r2 = Math.random() * 14;
          p[i * 3]     = Math.cos(a2) * r2;
          p[i * 3 + 1] = 20 + Math.random() * 4;
          p[i * 3 + 2] = Math.sin(a2) * r2;
        }
      }
      leafPtGeo.attributes.position.needsUpdate = true;

      controls.update();
      renderer.render(scene, camera);
    }

    animate();

    // ── Register service worker for PWA offline support ───────────────────────
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
